<style>

:root{
  --brand:#0B6E4F;
  --brand-dark:#074A35;
  --accent:#C99A2E;
  --bg:#F7F5EF;
  --surface:#FFFFFF;
  --text:#1B2420;
  --muted:#6B7770;
  --danger:#B03A2E;
  --radius:16px;
}
[data-theme="teal"]{ --brand:#0E5C6B; --brand-dark:#083E48; --accent:#3FB6A8; }
[data-theme="maroon"]{ --brand:#6B1E2B; --brand-dark:#4A121C; --accent:#C99A2E; }
[data-theme="navy"]{ --brand:#152A54; --brand-dark:#0D1B38; --accent:#9FB4D6; }
[data-theme="gold"]{ --brand:#8a6a1a; --brand-dark:#000000; --accent:#E8B93D; --bg:#0d0b08; --surface:#171310; --text:#F3EAD6; --muted:#a89a7c; }
[data-mode="dark"] header{background:#000;border-bottom:1px solid rgba(var(--acc-rgb),.25);box-shadow:none;}
[data-mode="dark"] header .backBtn,[data-mode="dark"] header .iconBtn{background:rgba(var(--acc-rgb),.12);color:var(--accent);}
[data-mode="dark"] header .appTitle{color:var(--accent);}
[data-mode="dark"] nav.bottom{background:#000;border-top:1px solid rgba(var(--acc-rgb),.18);}
[data-mode="dark"] nav.bottom button{color:#8a8272;}
[data-mode="dark"] nav.bottom button.active{color:var(--accent);}
[data-mode="dark"] .card,[data-mode="dark"] .post,[data-mode="dark"] .sectionIntro,[data-mode="dark"] .contactCard,
[data-mode="dark"] .tab,[data-mode="dark"] .sheet,[data-mode="dark"] .settingsRow,[data-mode="dark"] .prayerBox,
[data-mode="dark"] .subCard{ background:var(--surface); border-color:rgba(var(--acc-rgb),.22); color:var(--text); }
[data-mode="dark"] .settingsRow .sic{background:rgba(var(--acc-rgb),.12);color:var(--accent);}
[data-mode="dark"] .hero{background:linear-gradient(135deg,#171310,#000);}
[data-mode="dark"] .field input,[data-mode="dark"] .field textarea,[data-mode="dark"] .field select{background:#0d0b08;color:var(--text);border-color:rgba(var(--acc-rgb),.3);}
[data-mode="dark"] .empty,[data-mode="dark"] .sectionIntro p{color:var(--muted);}
[data-mode="dark"] .settingsGroupTitle{color:var(--accent);}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'Noto Sans Ethiopic', system-ui, -apple-system, sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-tap-highlight-color:transparent;
}
#app{display:flex;flex-direction:column;min-height:100vh;}

/* Header */
header{
  background:var(--brand);
  color:#fff;
  padding:16px 16px 14px;
  display:flex;
  align-items:center;
  gap:10px;
  position:sticky;top:0;z-index:20;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}
header .backBtn{
  width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;border:none;color:#fff;
}
header .titleWrap{flex:1;min-width:0;}
header .appTitle{font-size:18px;font-weight:800;margin:0;}
header .subTitle{font-size:12px;opacity:.85;margin:0;}
header .iconBtn{
  width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;font-size:17px;border:none;color:#fff;flex:none;
}
.headerLogo{width:34px;height:34px;border-radius:9px;object-fit:cover;flex:none;background:#fff;padding:2px;}
nav.bottom button .navLabel{display:block;max-width:56px;margin:0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
nav.bottom button.navHighlight{color:var(--accent);font-weight:800;}
nav.bottom button.navHighlight .ni{font-size:21px;}

main{flex:1;padding:16px 16px 90px;max-width:640px;margin:0 auto;width:100%;}

/* Home grid */
.hero{
  background:linear-gradient(135deg,var(--brand),var(--brand-dark));
  border-radius:var(--radius);
  color:#fff;padding:22px 18px;margin-bottom:18px;position:relative;overflow:hidden;text-align:center;
}
.hero .crescent{position:absolute;right:-10px;top:-18px;font-size:90px;opacity:.15;}
.heroLogo{width:68px;height:68px;border-radius:16px;object-fit:cover;background:#fff;padding:5px;box-shadow:0 4px 12px rgba(0,0,0,.3);margin-bottom:10px;}
.hero h2{margin:0 0 6px;font-size:20px;font-weight:800;}
.hero p{margin:0;font-size:13.5px;opacity:.9;line-height:1.5;}

.grid{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
}
.card{
  background:var(--surface);border-radius:var(--radius);padding:16px 12px;
  display:flex;flex-direction:column;align-items:flex-start;gap:10px;
  border:1px solid rgba(0,0,0,.05);
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.card .ic{
  width:42px;height:42px;border-radius:12px;background:rgba(11,110,79,.1);
  display:flex;align-items:center;justify-content:center;font-size:21px;
}
.card .lbl{font-size:13.5px;font-weight:700;line-height:1.35;}

/* Section header */
.sectionIntro{
  background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:14px;
  border:1px solid rgba(0,0,0,.05);
}
.sectionIntro h3{margin:0 0 6px;font-size:16px;}
.sectionIntro p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.6;}

.tabs{display:flex;gap:8px;margin-bottom:14px;}
.tab{
  flex:1;text-align:center;padding:10px;border-radius:12px;background:var(--surface);
  border:1px solid rgba(0,0,0,.08);font-weight:700;font-size:13.5px;color:var(--muted);
}
.tab.active{background:var(--brand);color:#fff;border-color:var(--brand);}

/* Feed */
.post{
  background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:12px;
  border:1px solid rgba(0,0,0,.05);
}
.post img{width:100%;border-radius:10px;margin:8px 0;display:block;}
.post h4{margin:0 0 6px;font-size:15px;}
.post p{margin:0;font-size:13.5px;line-height:1.6;white-space:pre-wrap;}
.post .meta{font-size:11.5px;color:var(--muted);margin-top:8px;}
.post .linkBtn,.post audio,.post iframe{margin-top:10px;width:100%;}
.post .linkBtn{
  display:inline-block;background:var(--brand);color:#fff;text-decoration:none;
  padding:9px 14px;border-radius:10px;font-size:13px;font-weight:700;
}
.post iframe{height:200px;border:none;border-radius:10px;}
.postActions{display:flex;gap:8px;margin-top:10px;}
.postActions button{
  border:none;background:rgba(0,0,0,.06);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--text);
}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:30px 10px;}

/* Floating add button */
.fab{
  position:fixed;bottom:78px;right:18px;width:54px;height:54px;border-radius:50%;
  background:var(--accent);color:#fff;border:none;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.25);
  z-index:30;
}

/* Bottom nav */
nav.bottom{
  position:fixed;bottom:0;left:0;right:0;background:var(--surface);
  display:flex;border-top:1px solid rgba(0,0,0,.07);z-index:20;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
nav.bottom button{
  flex:1;border:none;background:none;padding:10px 4px 8px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:700;
}
nav.bottom button.active{color:var(--brand);}
nav.bottom .ni{font-size:19px;}

/* Modal */
.overlay{
  position:fixed;inset:0;background:rgba(10,15,12,.5);z-index:50;display:flex;align-items:flex-end;
}
.sheet{
  background:var(--surface);border-radius:20px 20px 0 0;padding:18px;width:100%;max-height:88vh;overflow:auto;
}
.sheet h3{margin:0 0 14px;font-size:17px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:700;}
.field input[type=text],.field input[type=url],.field textarea,.field select{
  width:100%;padding:11px;border-radius:10px;border:1px solid rgba(0,0,0,.15);font-size:14px;
  font-family:inherit;background:#fff;color:var(--text);
}
.field textarea{min-height:80px;resize:vertical;}
.row2{display:flex;gap:10px;}
.row2 .field{flex:1;}
.btnRow{display:flex;gap:10px;margin-top:6px;}
.btn{
  flex:1;padding:12px;border-radius:12px;border:none;font-weight:800;font-size:14px;
}
.btn.primary{background:var(--brand);color:#fff;}
.btn.ghost{background:rgba(0,0,0,.06);color:var(--text);}
.closeX{position:absolute;top:14px;left:14px;background:rgba(0,0,0,.06);border:none;width:30px;height:30px;border-radius:50%;font-size:16px;}

.themeRow{display:flex;gap:10px;margin:10px 0 4px;}
.themeDot{width:38px;height:38px;border-radius:50%;border:3px solid transparent;}
.themeDot.active{border-color:var(--text);}

.socialBtn{
  display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:14px;
  margin-bottom:10px;border:1px solid rgba(0,0,0,.06);text-decoration:none;color:var(--text);font-weight:700;
}
.socialBtn .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;}

.contactCard{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:14px;border:1px solid rgba(0,0,0,.05);}
.contactCard .row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid rgba(0,0,0,.05);font-size:14px;}
.contactCard .row:last-child{border-bottom:none;}
.contactCard .row .k{width:26px;flex:none;}

/* Worship page components */
.actionBtnsRow{display:flex;gap:10px;margin-bottom:16px;}
.actionBtn{flex:1;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:800;text-align:center;}
[data-mode="dark"] .actionBtn{color:#1a1410;}
.actionBtn .ic{font-size:20px;}

.prayerBox{border:1px solid var(--accent);border-radius:16px;padding:14px 10px;margin-bottom:18px;}
.prayerBox h4{text-align:center;color:var(--accent);margin:0 0 12px;font-size:15px;}
.prayerRow{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
.prayerCell{flex:none;min-width:78px;border:1px solid var(--accent);border-radius:10px;padding:10px 8px;text-align:center;}
.prayerCell .pn{font-size:11.5px;color:var(--muted);margin-bottom:4px;}
.prayerCell .pt{font-weight:800;font-size:13px;}
.editTimesBtn{display:block;margin:10px auto 0;background:none;border:none;color:var(--accent);font-size:12px;font-weight:700;}

.subGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
.subCard{background:var(--surface);border:1px solid rgba(0,0,0,.08);border-radius:14px;padding:14px 8px;text-align:center;}
.subCard .ic{font-size:24px;margin-bottom:8px;}
.subCard .lbl{font-size:12px;font-weight:700;}

.sectionLabel{color:var(--accent);font-weight:800;font-size:14px;margin:4px 0 10px;}

.practiceGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px;}
.practiceGrid .subCard .ic{font-size:22px;}
.practiceGrid .subCard .lbl{font-size:11px;}

.bannerCard{border:1px solid var(--accent);border-radius:16px;padding:20px 16px;margin-bottom:18px;background:linear-gradient(135deg,rgba(0,0,0,.75),rgba(0,0,0,.45));color:#fff;text-align:center;}
.bannerCard h3{margin:0 0 4px;font-size:20px;letter-spacing:1px;color:var(--accent);}
.bannerCard p{margin:0;font-size:12.5px;opacity:.85;}

.recentHeader{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.recentHeader .rBtn{background:none;border:1px solid var(--accent);color:var(--accent);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;}
.recentHeader .refresh{background:none;border:none;color:var(--muted);font-size:16px;}

.tasbihWrap{text-align:center;padding:20px 0 6px;}
.tasbihCount{font-size:52px;font-weight:800;color:var(--accent);margin-bottom:16px;}
.tasbihBtn{width:120px;height:120px;border-radius:50%;background:var(--accent);border:none;color:#1a1410;font-size:15px;font-weight:800;}
.tasbihReset{display:block;margin:16px auto 0;background:none;border:none;color:var(--muted);font-size:13px;font-weight:700;}

/* Settings grouped rows */
.settingsGroupTitle{font-size:12.5px;color:var(--muted);font-weight:800;margin:18px 4px 8px;}
.settingsGroupTitle:first-child{margin-top:2px;}
.settingsRow{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:13px 14px;margin-bottom:8px;border:1px solid rgba(0,0,0,.05);}
.settingsRow .sic{width:38px;height:38px;border-radius:50%;background:rgba(var(--acc-rgb),.15);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;color:var(--accent);}
.settingsRow .stext{flex:1;min-width:0;}
.settingsRow .stext .st1{font-weight:700;font-size:14px;}
.settingsRow .stext .st2{font-size:12px;color:var(--muted);margin-top:2px;}
.settingsRow .chev{color:var(--muted);font-size:16px;}
.settingsRow.danger .sic{background:rgba(176,58,46,.15);color:var(--danger);}
.settingsRow.danger .st1{color:var(--danger);}

/* Dhikr / Dua / Salawat cards */
.dhikrCard{background:var(--surface);border:1px solid rgba(0,0,0,.08);border-radius:16px;padding:16px;margin-bottom:14px;}
.dhikrBadge{display:inline-block;background:rgba(var(--acc-rgb),.15);color:var(--accent);font-size:11px;font-weight:800;padding:5px 10px;border-radius:20px;margin-bottom:12px;}
.dhikrHead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px;}
.dhikrTitle{font-weight:800;font-size:15px;color:var(--accent);}
.dhikrSub{font-size:12px;color:var(--muted);margin-top:2px;}
.dhikrRec{font-size:11px;color:var(--muted);white-space:nowrap;}
.dhikrAr{font-size:22px;line-height:1.9;text-align:center;margin:10px 0;direction:rtl;}
.dhikrTranslit{color:var(--accent);font-style:italic;font-size:13px;margin-bottom:8px;line-height:1.5;}
.dhikrEn{font-size:13.5px;margin-bottom:8px;line-height:1.6;}
.dhikrAm{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:8px;}
.dhikrSrc{font-size:11.5px;color:var(--muted);}
.counterRow{display:flex;gap:10px;margin-top:12px;}
.resetBtn{width:42px;height:42px;border-radius:10px;background:rgba(0,0,0,.06);border:none;font-size:16px;color:var(--muted);flex:none;}
.countBtn{flex:1;background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:10px;font-weight:800;font-size:16px;}
[data-mode="dark"] .resetBtn{background:rgba(var(--acc-rgb),.1);color:var(--accent);}
[data-mode="dark"] .dhikrCard{background:var(--surface);border-color:rgba(var(--acc-rgb),.2);}

.tasbihAr{font-size:34px;color:var(--accent);text-align:center;margin-top:10px;direction:rtl;}
.tasbihWord{font-size:22px;font-weight:800;text-align:center;margin-top:6px;}
.tasbihMean{text-align:center;color:var(--muted);font-size:13px;margin-bottom:10px;}
.tasbihRing{width:200px;height:200px;border-radius:50%;border:3px solid rgba(0,0,0,.12);margin:14px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;}
[data-mode="dark"] .tasbihRing{border-color:rgba(255,255,255,.12);}
.tasbihRing #tasbihNum{font-size:46px;font-weight:800;color:var(--text);}
.tasbihTarget{font-size:14px;color:var(--muted);}
.tasbihBtn{width:130px;height:130px;border-radius:50%;background:transparent;border:3px solid var(--accent);color:var(--accent);font-size:38px;display:block;margin:10px auto 0;}

/* ================= v2 ================= */
:root{ --acc-rgb:201,154,46; --tile:#1E88E5; }
[data-theme="teal"]{ --acc-rgb:63,182,168; --bg:#F0F7F8; }
[data-theme="maroon"]{ --acc-rgb:201,154,46; --bg:#FAF2F3; }
[data-theme="navy"]{ --acc-rgb:159,180,214; --bg:#F1F4FA; }
[data-theme="royal"]{ --brand:#1E5BC6; --brand-dark:#123B8A; --accent:#F2B632; --acc-rgb:242,182,50; --bg:#F1F5FC; }
[data-theme="purple"]{ --brand:#5B3FA8; --brand-dark:#3B2778; --accent:#E0A526; --acc-rgb:224,165,38; --bg:#F5F2FB; }
[data-theme="sunset"]{ --brand:#C4571A; --brand-dark:#8E3B0F; --accent:#F2B632; --acc-rgb:242,182,50; --bg:#FBF4EE; }
[data-theme="rose"]{ --brand:#B0305F; --brand-dark:#7A1E40; --accent:#E6A23C; --acc-rgb:230,162,60; --bg:#FBF1F4; }
[data-theme="brown"]{ --brand:#6B4A2B; --brand-dark:#46301B; --accent:#D4A24C; --acc-rgb:212,162,76; --bg:#F8F3EC; }
[data-theme="sky"]{ --brand:#0A8FBF; --brand-dark:#06617F; --accent:#FFB703; --acc-rgb:255,183,3; --bg:#EFF8FC; }
[data-theme="gold"]{ --acc-rgb:232,185,61; }
[data-theme="nightblue"]{ --brand:#2F6FDE; --brand-dark:#000000; --accent:#6EA8FF; --acc-rgb:110,168,255; --bg:#0a0e17; --surface:#131a29; --text:#E8EEF9; --muted:#93a1bd; }
[data-theme="emeraldnight"]{ --brand:#0B6E4F; --brand-dark:#000000; --accent:#3DDC97; --acc-rgb:61,220,151; --bg:#08110d; --surface:#10201a; --text:#E6F5EE; --muted:#8fb0a2; }
[data-theme="purplenight"]{ --brand:#5B3FA8; --brand-dark:#000000; --accent:#C6A0FF; --acc-rgb:198,160,255; --bg:#0f0b17; --surface:#1a1326; --text:#EEE8F9; --muted:#a397bd; }

body{overflow-x:hidden;}
.shell{flex:1;display:flex;flex-direction:column;min-height:100vh;}
header{background:linear-gradient(135deg,var(--brand),var(--brand-dark));}

/* splash */
#splash{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 32%,#1a4a9a 0%,#0b1f47 58%,#050b1c 100%);color:#fff;transition:opacity .6s ease,visibility .6s;}
#splash.hide{opacity:0;visibility:hidden;}
#splash img{width:132px;height:132px;border-radius:32px;background:#fff;padding:10px;object-fit:cover;
  animation:pop .8s cubic-bezier(.2,.9,.3,1.3) both,pulse 1.8s .8s ease-out infinite;}
#splash h1{margin:24px 24px 6px;font-size:22px;font-weight:800;text-align:center;animation:fadeUp .8s .3s both;}
#splash p{margin:0;opacity:.85;font-size:15px;color:#F2B632;font-weight:700;animation:fadeUp .8s .5s both;}
#splash .dots{margin-top:30px;display:flex;gap:8px;}
#splash .dots i{width:8px;height:8px;border-radius:50%;background:#F2B632;animation:bounce 1s infinite;}
#splash .dots i:nth-child(2){animation-delay:.15s;} #splash .dots i:nth-child(3){animation-delay:.3s;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,182,50,.55);}100%{box-shadow:0 0 0 36px rgba(242,182,50,0);}}
@keyframes pop{0%{transform:scale(.4);opacity:0;}100%{transform:scale(1);opacity:1;}}
@keyframes fadeUp{0%{transform:translateY(14px);opacity:0;}100%{transform:none;opacity:1;}}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.5;}40%{transform:scale(1);opacity:1;}}

/* hero + cards */
.hero{background:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2760%27 height=%2760%27 viewBox=%270 0 60 60%27%3E%3Cg fill=%27none%27 stroke=%27white%27 stroke-opacity=%27.13%27 stroke-width=%271%27%3E%3Cpath d=%27M30 4l6.5 15.7L52 26l-15.5 6.3L30 48l-6.5-15.7L8 26l15.5-6.3z%27/%3E%3Ccircle cx=%2730%27 cy=%2726%27 r=%2722%27/%3E%3C/g%3E%3C/svg%3E"),linear-gradient(135deg,var(--brand),var(--brand-dark));background-size:60px 60px,auto;
  box-shadow:0 8px 22px rgba(0,0,0,.18);animation:fadeUp .5s both;}
[data-mode="dark"] .hero{background:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2760%27 height=%2760%27 viewBox=%270 0 60 60%27%3E%3Cg fill=%27none%27 stroke=%27white%27 stroke-opacity=%27.13%27 stroke-width=%271%27%3E%3Cpath d=%27M30 4l6.5 15.7L52 26l-15.5 6.3L30 48l-6.5-15.7L8 26l15.5-6.3z%27/%3E%3Ccircle cx=%2730%27 cy=%2726%27 r=%2722%27/%3E%3C/g%3E%3C/svg%3E"),linear-gradient(135deg,var(--surface),#000);background-size:60px 60px,auto;border:1px solid rgba(var(--acc-rgb),.3);}
.greet{font-size:14px;margin:6px 0 2px;color:#FFD86B;font-weight:800;}
.heroChips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;}
.card{animation:fadeUp .5s both;transition:transform .15s;position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.card:active{transform:scale(.96);}
.card::after{content:'';position:absolute;right:-20px;bottom:-20px;width:74px;height:74px;border-radius:50%;background:var(--tile);opacity:.08;}
.card .ic{background:transparent !important;position:relative;z-index:0;width:48px;height:48px;border-radius:15px;font-size:24px;}
.card .ic::before{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--tile);opacity:.2;z-index:-1;}
nav.bottom{box-shadow:0 -4px 16px rgba(0,0,0,.08);}
nav.bottom button .ni{transition:transform .2s;}
nav.bottom button.active .ni{transform:translateY(-2px) scale(1.15);}

/* inputs */
.field input:not([type=file]):not([type=checkbox]){width:100%;padding:11px;border-radius:10px;border:1px solid rgba(0,0,0,.15);font-size:14px;font-family:inherit;background:#fff;color:#1B2420;}
[data-mode="dark"] .field input:not([type=file]){background:var(--bg);color:var(--text);border-color:rgba(var(--acc-rgb),.3);}
.field input[type=file]{width:100%;font-size:13px;color:var(--text);}
.hint{font-size:12px;color:var(--muted);margin:2px 0 10px;}

/* media in posts */
.post video{width:100%;border-radius:10px;margin:8px 0;background:#000;max-height:340px;display:block;}

/* reactions + comments */
.react{display:flex;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(var(--acc-rgb),.2);}
.rb{flex:1;background:rgba(0,0,0,.05);border:1px solid transparent;border-radius:10px;padding:8px 6px;font-size:13px;font-weight:700;color:var(--text);font-family:inherit;}
[data-mode="dark"] .rb{background:rgba(255,255,255,.06);}
.rb.on{background:rgba(var(--acc-rgb),.18);border-color:var(--accent);color:var(--accent);}
.cmts{margin-top:10px;}
.cmt{background:rgba(0,0,0,.045);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:13px;line-height:1.5;}
[data-mode="dark"] .cmt{background:rgba(255,255,255,.06);}
.cmt b{display:block;font-size:12px;color:var(--accent);}
.cmt small{color:var(--muted);font-size:11px;}
.cmt .del{float:right;background:none;border:none;color:var(--danger);font-size:12px;}
.cmtForm{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
.cmtForm .row{display:flex;gap:6px;}
.cmtForm input{padding:9px;border-radius:9px;border:1px solid rgba(0,0,0,.15);font-family:inherit;font-size:13px;background:#fff;color:#1B2420;width:100%;}
[data-mode="dark"] .cmtForm input{background:var(--bg);color:var(--text);border-color:rgba(var(--acc-rgb),.3);}
.cmtForm button{background:var(--brand);color:#fff;border:none;border-radius:9px;padding:0 14px;font-weight:800;font-family:inherit;}
[data-mode="dark"] .cmtForm button{background:var(--accent);color:#1a1410;}

/* toast */
.toast{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:92px;background:#111;color:#fff;padding:11px 16px;border-radius:14px;
  font-size:13px;font-weight:700;z-index:300;max-width:88%;box-shadow:0 6px 20px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18);animation:fadeUp .3s both;}

/* theme + language pickers */
.themeGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:10px 0 6px;}
.themeItem{text-align:center;font-size:10.5px;color:var(--muted);font-weight:700;}
.themeItem .dot{width:44px;height:44px;border-radius:50%;margin:0 auto 4px;border:3px solid transparent;box-shadow:0 2px 6px rgba(0,0,0,.25);}
.themeItem.active .dot{border-color:var(--text);}
.langRow{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-radius:12px;margin-bottom:8px;background:rgba(0,0,0,.05);font-weight:700;}
[data-mode="dark"] .langRow{background:rgba(255,255,255,.06);}
.langRow.active{background:var(--brand);color:#fff;}
[data-mode="dark"] .langRow.active{background:var(--accent);color:#1a1410;}

/* RTL */
[dir="rtl"] .backBtn,[dir="rtl"] .chev{transform:scaleX(-1);}
[dir="rtl"] .fab{right:auto;left:18px;}
[dir="rtl"] .closeX{left:auto;right:14px;}
[dir="rtl"] .cmt .del{float:left;}

/* ===== Website additions ===== */
@media (min-width:700px){
  body{background:#0b0b0b;}
  #app{max-width:640px;margin:0 auto;box-shadow:0 0 40px rgba(0,0,0,.5);background:var(--bg);}
  nav.bottom{left:50%;right:auto;transform:translateX(-50%);width:100%;max-width:640px;}
  .fab{right:calc(50% - 320px + 18px);}
}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.compassWrap{position:relative;width:200px;height:200px;margin:0 auto;}
.compassWrap .ring{position:absolute;inset:0;transition:transform .15s linear;}
.compassWrap .kaaba{position:absolute;inset:0;transition:transform .15s linear;}
.compassHint{font-size:12px;color:var(--muted);margin-top:8px;}

/* ===== Install-app banner ===== */
#installBar{position:fixed;left:10px;right:10px;bottom:calc(74px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto;z-index:40;
  background:var(--surface);color:var(--text);border:1px solid var(--accent);border-radius:16px;padding:12px;box-shadow:0 8px 28px rgba(0,0,0,.35);
  display:flex;align-items:center;gap:10px;animation:fadeUp .35s both;}
#installBar img{width:44px;height:44px;border-radius:10px;flex:none;object-fit:cover;}
#installBar .it{flex:1;min-width:0;}
#installBar .it b{display:block;font-size:14px;}
#installBar .it span{display:block;font-size:12px;color:var(--muted);}
#installBar .ib{display:flex;flex-direction:column;gap:6px;flex:none;}
#installBar button,#installBar a{border:none;border-radius:10px;padding:9px 12px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;text-align:center;text-decoration:none;}
#installBar .go{background:var(--accent);color:#fff;}
#installBar .no{background:transparent;color:var(--muted);padding:2px 6px;font-size:12px;font-weight:600;}

/* ===== Daily worship tracker ===== */
.trackRow{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid rgba(var(--acc-rgb),.25);border-radius:14px;padding:12px 14px;margin-bottom:8px;font-family:inherit;font-size:14px;font-weight:700;color:var(--text);text-align:start;}
.trackRow.done{border-color:var(--accent);}
.trackBox{width:26px;height:26px;border-radius:8px;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;flex:none;}
.trackRow.done .trackBox{background:var(--accent);}
.trackEn{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px;}
.progBar{height:10px;border-radius:99px;background:rgba(var(--acc-rgb),.15);overflow:hidden;margin:8px 0;}
.progFill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s;}
.trackNote{font-size:12px;color:var(--muted);}
/* ===== Qaida Nooraniyah ===== */
.qIntro{background:var(--surface);border:1px solid rgba(var(--acc-rgb),.3);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.7;margin-bottom:12px;}
.qRow{display:grid;grid-template-columns:70px 1fr 1fr 1fr;gap:6px;align-items:stretch;background:var(--surface);border:1px solid rgba(var(--acc-rgb),.2);border-radius:14px;padding:8px;margin-bottom:8px;}
.qName{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);font-weight:700;background:none;border:none;font-family:inherit;}
.qName b{font-size:26px;color:var(--accent);font-family:'Noto Naskh Arabic','Amiri','Traditional Arabic',serif;line-height:1.3;}
.qCell{background:rgba(var(--acc-rgb),.08);border:1px solid rgba(var(--acc-rgb),.25);border-radius:12px;padding:10px 0;font-size:30px;line-height:1.4;color:var(--text);font-family:'Noto Naskh Arabic','Amiri','Traditional Arabic',serif;direction:rtl;}
.qCell:active,.qName:active{transform:scale(.95);}
.qHint{font-size:10.5px;color:var(--muted);text-align:center;margin-top:2px;font-family:system-ui,sans-serif;}
/* lesson list & nav */
.qLesson{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid rgba(var(--acc-rgb),.25);border-radius:14px;padding:12px 14px;margin-bottom:8px;font-family:inherit;font-size:14px;color:var(--text);text-align:start;}
.qNum{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;}
[data-mode="dark"] .qNum{color:#1a1410;}
.qNav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;}
.qBtn{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:9px 12px;font-family:inherit;font-weight:800;font-size:13px;}
[data-mode="dark"] .qBtn{color:#1a1410;}
.qWord{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid rgba(var(--acc-rgb),.25);border-radius:14px;padding:12px 14px;margin-bottom:8px;font-family:inherit;color:var(--text);}
.qWordAr{font-family:'Noto Naskh Arabic','Amiri','Traditional Arabic',serif;font-size:24px;direction:rtl;color:var(--accent);}
.qIcon{width:44px;height:44px;border-radius:12px;display:block;margin:0 auto;}
/* ===== Kids corner ===== */
.kidsScore{display:inline-block;background:#FFF3C4;color:#7A5A00;font-weight:800;padding:6px 14px;border-radius:20px;margin-bottom:12px;}
.kidsGame{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:2px solid rgba(255,183,3,.45);border-radius:18px;padding:12px 14px;margin-bottom:10px;font-family:inherit;color:var(--text);text-align:start;font-size:14px;}
.kidsEmo{width:50px;height:50px;border-radius:14px;background:#FFF3C4;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none;}
.kidsQ{font-size:16px;font-weight:800;text-align:center;margin:10px 0;line-height:1.7;}
.kidsSpeak{display:block;margin:0 auto 12px;background:var(--brand);color:#fff;border:none;border-radius:14px;padding:10px 18px;font-family:inherit;font-weight:800;}
.kidsGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.kidsGridCol{grid-template-columns:1fr;}
.kidsOpt{background:var(--surface);border:2px solid rgba(var(--acc-rgb),.35);border-radius:16px;padding:14px 8px;font-family:inherit;font-size:15px;font-weight:700;color:var(--text);}
.kidsLetter{font-family:'Noto Naskh Arabic','Amiri','Traditional Arabic',serif;font-size:40px;color:var(--accent);padding:10px 0;}
.kidsWordBig{display:block;margin:6px auto 12px;background:var(--surface);border:2px solid var(--accent);border-radius:18px;padding:14px 26px;font-family:'Noto Naskh Arabic','Amiri','Traditional Arabic',serif;font-size:34px;color:var(--accent);direction:rtl;}
.kidsMsg{background:#E8F7EE;color:#1B6B3A;border-radius:14px;padding:10px;text-align:center;font-weight:800;margin-bottom:10px;}
.kidsDone{background:var(--surface);border:1px solid rgba(var(--acc-rgb),.3);border-radius:12px;padding:8px 12px;margin-bottom:6px;font-size:13px;font-weight:700;}
.kidsNext{display:block;margin:12px auto;background:#FFB703;color:#fff;border:none;border-radius:14px;padding:11px 22px;font-family:inherit;font-weight:800;}
.kidsBack{display:block;margin:14px auto 0;background:none;border:none;color:var(--muted);font-family:inherit;font-weight:700;}
/* ===== 99 Names grid ===== */
.asmaIntro{text-align:center;color:var(--accent);font-weight:800;font-size:14px;margin:4px 0 12px;}
.asmaGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.asmaCard{position:relative;background:var(--surface);border:1px solid rgba(var(--acc-rgb),.35);border-radius:16px;padding:16px 8px 12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.asmaNum{position:absolute;top:7px;left:9px;width:22px;height:22px;border-radius:50%;background:rgba(var(--acc-rgb),.16);color:var(--accent);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.asmaAr{font-size:24px;line-height:1.6;color:var(--accent);direction:rtl;}
.asmaEn{font-size:13px;font-weight:800;margin-top:2px;}
.asmaAm{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5;}
@media (max-width:340px){.asmaGrid{grid-template-columns:1fr;}}
/* ===== AI chat ===== */
.aiFab{position:fixed;bottom:78px;left:18px;width:58px;height:58px;border-radius:50%;background:#fff;border:2px solid var(--accent);padding:0;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:30;}
.aiFab img{width:100%;height:100%;object-fit:cover;display:block;}
.aiWrap{display:flex;flex-direction:column;gap:10px;}
.aiNote{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid rgba(var(--acc-rgb),.3);border-radius:12px;padding:9px 12px;line-height:1.5;}
.aiList{display:flex;flex-direction:column;gap:10px;}
.aiMsg{display:flex;}
.aiMsg.user{justify-content:flex-end;}
.aiBub{max-width:85%;padding:10px 13px;border-radius:14px;background:var(--surface);border:1px solid rgba(0,0,0,.06);font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word;}
.aiMsg.user .aiBub{background:var(--brand);color:#fff;border-color:transparent;}
.aiForm{display:flex;gap:8px;position:sticky;bottom:0;background:var(--bg);padding:6px 0;}
.aiForm input{flex:1;padding:12px;border-radius:12px;border:1px solid rgba(0,0,0,.15);font-size:14px;font-family:inherit;background:#fff;color:var(--text);}
[data-mode="dark"] .aiForm input{background:var(--surface);}
.aiSend{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:0 16px;font-weight:800;font-family:inherit;}
[data-mode="dark"] .aiSend{color:#1a1410;}
.aiSend:disabled{opacity:.5;}
</style>

function gregorianToHijri(date){
  let jd = Math.floor((1461*(date.getFullYear()+4800+Math.floor((date.getMonth()+1-14)/12)))/4)
    +Math.floor((367*(date.getMonth()+1-2-12*Math.floor((date.getMonth()+1-14)/12)))/12)
    -Math.floor((3*Math.floor((date.getFullYear()+4900+Math.floor((date.getMonth()+1-14)/12))/100))/4)
    +date.getDate()-32075;
  let l = jd - 1948440 + 10632;
  let n = Math.floor((l-1)/10631);
  l = l - 10631*n + 354;
  let j = (Math.floor((10985-l)/5316))*(Math.floor((50*l)/17719)) + (Math.floor(l/5670))*(Math.floor((43*l)/15238));
  l = l - (Math.floor((30-j)/15))*(Math.floor((17719*j)/50)) - (Math.floor(j/16))*(Math.floor((15238*j)/43)) + 29;
  let month = Math.floor((24*l)/709);
  let day = l - Math.floor((709*month)/24);
  let year = 30*n + j - 30;
  return {day, month, year};
}
function qiblaBearing(lat,lon){
  const toRad=d=>d*Math.PI/180, toDeg=r=>r*180/Math.PI;
  const kLat=toRad(21.4225), kLon=toRad(39.8262);
  const phi1=toRad(lat), lam1=toRad(lon);
  const dLon = kLon-lam1;
  const y = Math.sin(dLon)*Math.cos(kLat);
  const x = Math.cos(phi1)*Math.sin(kLat)-Math.sin(phi1)*Math.cos(kLat)*Math.cos(dLon);
  let brng = toDeg(Math.atan2(y,x));
  return (brng+360)%360;
}

function norm24(s){
  s=(s||'').trim();
  let m=s.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
  if(m){ let h=(+m[1])%12; if(m[3].toUpperCase()==='PM') h+=12; return String(h).padStart(2,'0')+':'+m[2]; }
  m=s.match(/^(\d{1,2}):(\d{2})$/);
  if(m) return String(+m[1]).padStart(2,'0')+':'+m[2];
  return s;
}
function formatTime12(hhmm){
  const p=(hhmm||'').split(':'); if(p.length<2) return hhmm||'--:--';
  const h=parseInt(p[0],10); const ap=h>=12?'PM':'AM'; let h12=h%12; if(h12===0) h12=12;
  return h12+':'+p[1]+' '+ap;
}

function icSvg(name){
  const body=name==='thumbDown'?'<g transform="rotate(180 12 12)">'+IC_PATHS.thumbUp+'</g>':IC_PATHS[name];
  return '<svg class="mi" viewBox="0 0 24 24" aria-hidden="true">'+body+'</svg>';

function modernIcons(root){
  if(!root||!root.ownerDocument) return;
  const w=root.ownerDocument.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
  const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  const re=new RegExp('('+Object.keys(IC_MAP).join('|')+')\\uFE0F?','gu');
  nodes.forEach(function(n){
    const v=n.nodeValue; re.lastIndex=0; if(!re.test(v)) return; re.lastIndex=0;
    const parts=v.split(re); const frag=root.ownerDocument.createDocumentFragment(); let changed=false;
    parts.forEach(function(p){
      if(!p) return;
      const base=p.replace(/\uFE0F/g,'');
      if(IC_MAP[base]){ changed=true; const sp=root.ownerDocument.createElement('span'); sp.innerHTML=icSvg(IC_MAP[base]); frag.appendChild(sp.firstChild); }
      else frag.appendChild(root.ownerDocument.createTextNode(p));
    });
    if(changed) n.parentNode.replaceChild(frag,n);
  });
}

async function awSync(){
  try{
    const res=await Promise.all([awRows(AW.T.posts),awRows(AW.T.reactions),awRows(AW.T.comments)]);
    const posts=res[0], reacts=res[1], cmts=res[2];
    const fresh={}; Object.keys(DATA.posts).forEach(function(k){ fresh[k]=[]; });
    posts.forEach(function(r){
      if(!fresh[r.section]) fresh[r.section]=[];
      fresh[r.section].push({id:r.$id,title:r.title||'',body:r.body||'',video:r.mediaUrl||'',link:r.link||'',date:fmtDate(r.$createdAt)});
    });
    if(!fresh.about.length && DATA.posts.about) fresh.about=DATA.posts.about;
    const social={};
    const get=function(id){ return social[id]||(social[id]={like:0,dislike:0,mine:null,comments:[]}); };
    const dev=awDevice();
    reacts.forEach(function(r){
      const s=get(r.postId);
      if(r.value==='like') s.like++; else if(r.value==='dislike') s.dislike++;
      if(r.deviceId===dev) s.mine=(r.value==='like'||r.value==='dislike')?r.value:null;
    });
    cmts.slice().sort(function(a,b){ return a.$createdAt<b.$createdAt?-1:1; }).forEach(function(r){
      get(r.postId).comments.push({name:r.name||'—',text:r.text||'',date:fmtDate(r.$createdAt),cloudId:r.$id});
    });
    DATA.posts=fresh; DATA.social=social; saveData(DATA);
  }catch(e){ console.log('sync failed',e); }
}

/* ================== MEDIA STORE (IndexedDB - works offline, big files) ================== */
let _db=null; const _urlCache={};
function mediaDB(){
  return new Promise((res,rej)=>{
    if(_db) return res(_db);
    if(!window.indexedDB) return rej(new Error('no idb'));
    const r=indexedDB.open('risala_media_v1',1);
    r.onupgradeneeded=()=>{ r.result.createObjectStore('blobs'); };
    r.onsuccess=()=>{ _db=r.result; res(_db); };
    r.onerror=()=>rej(r.error);
  });
}
async function mediaPut(blob){
  const id='m'+cuid(); const db=await mediaDB();
  await new Promise((res,rej)=>{ const tx=db.transaction('blobs','readwrite'); tx.objectStore('blobs').put(blob,id); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); });
  return id;
}
async function mediaGet(id){
  const db=await mediaDB();
  return new Promise((res,rej)=>{ const rq=db.transaction('blobs').objectStore('blobs').get(id); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); });
}
async function mediaDel(id){
  if(!id) return;
  try{ const db=await mediaDB(); await new Promise(res=>{ const tx=db.transaction('blobs','readwrite'); tx.objectStore('blobs').delete(id); tx.oncomplete=res; tx.onerror=res; }); }catch(e){}
  if(_urlCache[id]){ try{URL.revokeObjectURL(_urlCache[id]);}catch(e){} delete _urlCache[id]; }
}
async function mediaURL(id){
  if(_urlCache[id]) return _urlCache[id];
  try{ const b=await mediaGet(id); if(!b) return ''; return (_urlCache[id]=URL.createObjectURL(b)); }catch(e){ return ''; }
}
function hydrateMedia(){
  document.querySelectorAll('[data-mid]').forEach(async el=>{
    const u=await mediaURL(el.getAttribute('data-mid'));
    if(u){ el.src=u; if(el.load && el.tagName!=='IMG') el.load(); }
  });
}

      else new Notification(title,opt);

  }catch(e){}
}

function feedKeyForPage(){
  if(ROUTE.page==='feature'){
    const f=FEATURES.find(x=>x.key===ROUTE.key); if(!f) return null;
    if(f.type==='feed') return f.key;
    if(f.type==='tabs') return ROUTE.tab;
    if(f.type==='social') return 'social_extra';
    return null;
  }
  if(ROUTE.page==='sub') return ROUTE.key;
  if(ROUTE.page==='duaLike') return ROUTE.cat==='adhkar'?'worship_adhkar':'worship_dua';
  if(ROUTE.page==='salawat') return 'worship_salawat';
  return null;
}
function navActive(k){
  if(k==='home') return ROUTE.page==='home';
  if(k==='settings') return ROUTE.page==='settings';
  if(k==='worship') return (ROUTE.page==='feature'&&ROUTE.key==='worship')||WORSHIP_PAGES.includes(ROUTE.page);
  return ROUTE.page==='feature'&&ROUTE.key===k;
}
function navBtn(k,icon,label,fn,extra){
  return `<button class="${extra||''} ${navActive(k)?'active':''}" onclick="${fn}"><span class="ni">${icon}</span><span class="navLabel">${label}</span></button>`;
}

let AI_HISTORY = [{role:'assistant', content:'ሰላምአለይኩም! ስለ ኢስላም ማንኛውንም ጥያቄ ይጠይቁ።'}];
let AI_BUSY = false;
function aiEsc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function openAI(){ ROUTE={page:'ai'}; render(); }
function renderAI(){
  const msgs = AI_HISTORY.map(m=>`<div class="aiMsg ${m.role==='user'?'user':'assistant'}"><div class="aiBub">${aiEsc(m.content)}</div></div>`).join('');
  const typing = AI_BUSY ? `<div class="aiMsg assistant"><div class="aiBub">…</div></div>` : '';
  return `<div class="aiWrap">
    <div class="aiNote">⚠️ ይህ ረዳት ትምህርታዊ መረጃ ብቻ ይሰጣል። ፈትዋና ውሳኔ ለሚመለከታቸው ዓሊሞች ይተዉ።</div>
    <div class="aiList" id="aiList">${msgs}${typing}</div>
    <div class="aiForm">
      <input id="aiIn" placeholder="ጥያቄዎን ይጻፉ…" onkeydown="if(event.key==='Enter')sendAI()" ${AI_BUSY?'disabled':''}>
      <button class="aiSend" onclick="sendAI()" ${AI_BUSY?'disabled':''}>${t('send')||'ላክ'}</button>
    </div>
  </div>`;
}
async function sendAI(){
  const inp = document.getElementById('aiIn');
  const q = (inp && inp.value || '').trim();
  if(!q || AI_BUSY) return;
  AI_HISTORY.push({role:'user', content:q});
  AI_BUSY = true; render();
  let reply;
  try{
    if(!AI_ENDPOINT){
      reply = 'የAI አገልግሎቱ ገና አልተገናኘም። እስከዚያው ድረስ በቴሌግራም ይጠይቁን።';
    }else{
      // text/plain avoids a CORS preflight request; the function parses the JSON body itself
      const r = await fetch(AI_ENDPOINT, {
        method:'POST',
        headers:{'Content-Type':'text/plain'},
        body: JSON.stringify({messages: AI_HISTORY.slice(-12).map(m=>({role:m.role, content:m.content}))})
      });
      const j = await r.json().catch(()=>({}));
      reply = j.reply || j.error || ('ስህተት ተከስቷል (ኮድ ' + r.status + ')። እንደገና ይሞክሩ።');
    }
  }catch(e){
    reply = 'ከአገልጋዩ ጋር መገናኘት አልተቻለም። ኢንተርኔትዎን ያረጋግጡ። (' + (e && e.message ? e.message : 'unknown') + ')';
  }
  AI_HISTORY.push({role:'assistant', content:reply});
  AI_BUSY = false; render();
}

function render(){
  applyTheme();
  const sig=[ROUTE.page,ROUTE.key,ROUTE.tab,ROUTE.dtab,ROUTE.ttab,ROUTE.cat].join('|');
  const y=(sig===lastSig)?window.scrollY:0; lastSig=sig;
  let title=t('appName'), body='';
  if(ROUTE.page==='home') body=renderHome();
  else if(ROUTE.page==='settings'){ title=t('settings'); body=renderSettings(); }
  else if(ROUTE.page==='feature'){ const f=FEATURES.find(x=>x.key===ROUTE.key); title=L(f); body=renderFeature(f); }
  else if(ROUTE.page==='sub'){ title=ROUTE.subTitle; body=renderFeed(ROUTE.key); }
  else if(ROUTE.page==='asma'){ title=t('asma'); body=renderAsma(); }
  else if(ROUTE.page==='tasbih'){ title=t('tasbih'); body=renderTasbih(); }
  else if(ROUTE.page==='duaLike'){ title=ROUTE.cat==='adhkar'?t('adhkar'):t('dua'); body=renderDuaLike(); }
  else if(ROUTE.page==='salawat'){ title=t('salawat'); body=renderSalawatPage(); }
  else if(ROUTE.page==='ai'){ title='ኢስላማዊ ጥያቄ 🤖'; body=renderAI(); }
  else if(ROUTE.page==='tracker'){ title='የዕለታዊ ኢባዳ ✅'; body=renderTracker(); }
  else if(ROUTE.page==='qaida'){ title='ቃኢዳ ኑራኒያ'; body=renderQaida(); }
  const showBack=ROUTE.page!=='home';
  const nf=k=>L(FEATURES.find(f=>f.key===k));
  const right=ROUTE.page==='tasbih'?`<button class="iconBtn" onclick="resetTasbihCurrent()">⟳</button>`:(DATA.admin?`<span class="iconBtn">👤</span>`:'');
  const fk=feedKeyForPage();
  appEl.innerHTML=`
    <div class="shell">
      <header>
        ${showBack?`<button class="backBtn" onclick="goBack()">‹</button>`:`<div class="backBtn" style="opacity:0;pointer-events:none;">‹</div>`}
        <img class="headerLogo" src="${LOGO_URI}" alt="">
        <div class="titleWrap"><p class="appTitle">${title}</p><p class="subTitle">${ROUTE.page==='home'?t('appTag'):''}</p></div>
        ${right}
      </header>
      <main id="mainArea">${body}</main>
      ${(fk&&DATA.admin)?`<button class="fab" onclick="openAddPost()">+</button>`:''}
      <nav class="bottom">
        ${navBtn('home','🏠',t('home'),'goHome()')}

function nextPrayerText(){
  const pt=DATA.prayerTimes||{}; const order=['fajr','dhuhr','asr','maghrib','isha'];
  const now=new Date(); const nm=now.getHours()*60+now.getMinutes(); let best=null;
  for(const k of order){ if(!pt[k]) continue; const [h,m]=pt[k].split(':').map(Number); const mins=h*60+m; if(mins>nm){ best={k,mins}; break; } }
  if(!best){ if(!pt.fajr) return ''; const [h,m]=pt.fajr.split(':').map(Number); best={k:'fajr',mins:h*60+m+1440}; }
  const diff=best.mins-nm; return '🕋 '+t('nextPrayer')+': '+t(best.k)+' · '+Math.floor(diff/60)+':'+String(diff%60).padStart(2,'0');
}

function ytEmbed(u){
  u=safeUrl(u); if(!u) return '';
  const m=u.match(/(?:youtu\.be\/|v=|shorts\/)([A-Za-z0-9_-]{6,})/);
  if(m&&navigator.onLine) return `<iframe src="https://www.youtube.com/embed/${m[1]}" allowfullscreen></iframe>`;
  return `<a class="linkBtn" href="${escapeHtml(u)}" target="_blank" rel="noopener noreferrer" onclick="return extLink()">▶ ${t('video')}</a>`;
}
function socialOf(id){ return DATA.social[id]||(DATA.social[id]={like:0,dislike:0,mine:null,comments:[]}); }
function renderPost(p,key){
  let media='';
  if(p.imgId) media+=`<img data-mid="${p.imgId}" src="${BLANK}" alt="">`;
  else if(p.img) media+=`<img src="${p.img}" alt="">`;
  if(p.vidId) media+=`<video data-mid="${p.vidId}" controls playsinline preload="metadata"></video>`;
  if(p.video) media+=ytEmbed(p.video);
  if(p.audId) media+=`<audio data-mid="${p.audId}" controls></audio>`;
  else if(safeUrl(p.audio)) media+=`<audio controls src="${escapeHtml(safeUrl(p.audio))}"></audio>`;
  const lk=safeUrl(p.link);
  const linkBtn=lk?`<a class="linkBtn" href="${escapeHtml(lk)}" target="_blank" rel="noopener noreferrer" onclick="return extLink()">🔗 ${t('link')}</a>`:'';
  const s=socialOf(p.id);
  const open=!!OPEN_CMT[p.id];
  const cm=open?`<div class="cmts">
      ${s.comments.map((c,i)=>`<div class="cmt">${DATA.admin?`<button class="del" onclick="delComment('${p.id}',${i})">✕</button>`:''}<b>${escapeHtml(c.name)}</b>${escapeHtml(c.text)}<br><small>${escapeHtml(c.date)}</small></div>`).join('')}
      <div class="cmtForm">

        <div class="row"><input type="text" id="ct_${p.id}" placeholder="${t('writeComment')}"><button onclick="addComment('${p.id}')">${t('send')}</button></div>
      </div></div>`:'';
  const actions=DATA.admin?`<div class="postActions"><button onclick="deletePost('${key}','${p.id}')">🗑 ${t('delete')}</button></div>`:'';
  return `<div class="post">
    ${p.title?`<h4>${escapeHtml(p.title)}</h4>`:''}

      <button class="rb ${s.mine==='like'?'on':''}" onclick="react('${p.id}','like')">👍 ${t('like')} ${s.like||''}</button>

    </div>
    ${cm}${actions}
  </div>`;
}
function react(id,type){
  const s=socialOf(id);
  if(s.mine===type){ s[type]=Math.max(0,s[type]-1); s.mine=null; }
  else { if(s.mine) s[s.mine]=Math.max(0,s[s.mine]-1); s[type]++; s.mine=type; }
  saveData(DATA); render(); awReact(id,s.mine);
}

function addComment(id){

  const cm={name:n||DATA.userName||'—',text:tx.slice(0,500),date:today()}; socialOf(id).comments.push(cm);

function delComment(id,i){ awDel(AW.T.comments,(socialOf(id).comments[i]||{}).cloudId); socialOf(id).comments.splice(i,1); saveData(DATA); render(); }
async function deletePost(key,id){

/* ================== KIDS CORNER ================== */
const KIDS_WUDU=['ቢስሚላህ ማለት','እጅን ማጠብ','አፍን ማጠብ','አፍንጫን ማጠብ','ፊትን ማጠብ','ክንዶችን እስከ ክርን ማጠብ','ራስን ማበስ','ጆሮን ማበስ','እግሮችን ማጠብ'];
const KIDS={game:null,q:null,picked:[],msg:'',solved:false};
function kidsShuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function kidsStars(){ return DATA.kidStars||0; }
function kidsAddStar(){ DATA.kidStars=(DATA.kidStars||0)+1; saveData(DATA); }
function kidsStart(g){ KIDS.game=g; KIDS.msg=''; KIDS.solved=false; kidsNext(); render(); }
function kidsNext(){
  KIDS.msg=''; KIDS.solved=false; KIDS.picked=[];
  if(KIDS.game==='letters'){
    const target=QAIDA_LETTERS[Math.floor(Math.random()*QAIDA_LETTERS.length)];
    let opts=[target];
    while(opts.length<4){ const c=QAIDA_LETTERS[Math.floor(Math.random()*QAIDA_LETTERS.length)]; if(!opts.some(o=>o[0]===c[0])) opts.push(c); }
    KIDS.q={target, opts:kidsShuffle(opts)};
  }
  if(KIDS.game==='words'){
    const list=(QAIDA_LESSONS.find(l=>l.title.startsWith('10.'))||{}).items||[];
    const target=list[Math.floor(Math.random()*list.length)];
    let opts=[target[1]];
    while(opts.length<3){ const c=list[Math.floor(Math.random()*list.length)][1]; if(!opts.includes(c)) opts.push(c); }
    KIDS.q={target, opts:kidsShuffle(opts)};
  }
  if(KIDS.game==='wudu'){
    KIDS.q={order:kidsShuffle(KIDS_WUDU.map((_,i)=>i))};
  }
}
function kidsLetterAnswer(i){
  if(KIDS.solved) return;
  if(KIDS.q.opts[i][0]===KIDS.q.target[0]){ KIDS.solved=true; KIDS.msg='ጎበዝ! ⭐'; kidsAddStar(); }
  else KIDS.msg='ሞክር፣ እንደገና!';
  render();
}
function kidsWordAnswer(i){
  if(KIDS.solved) return;
  if(KIDS.q.opts[i]===KIDS.q.target[1]){ KIDS.solved=true; KIDS.msg='ጎበዝ! ⭐'; kidsAddStar(); }
  else KIDS.msg='ሞክር፣ እንደገና!';
  render();
}
function kidsWuduTap(idx){
  if(KIDS.solved) return;
  const expected=KIDS.picked.length;
  if(idx===expected){
    KIDS.picked.push(idx);
    if(KIDS.picked.length===KIDS_WUDU.length){ KIDS.solved=true; KIDS.msg='ጎበዝ! ሁሉንም በትክክል አደረግክ ⭐'; kidsAddStar(); }
    else KIDS.msg='ትክክል! ✓';
  } else {
    KIDS.msg='ቅደም ተከተሉን አስታውስ!';
  }
  render();
}

      <button class="kidsGame" onclick="kidsStart('words')"><span class="kidsEmo">🧩</span><span><b>ቃል ግጥሚያ</b><span class="trackEn">የቃሉን ትርጉም ይምረጡ</span></span></button>
      <button class="kidsGame" onclick="kidsStart('wudu')"><span class="kidsEmo">💧</span><span><b>የውዱእ ቅደም ተከተል</b><span class="trackEn">እርምጃዎቹን በትክክለኛው ቅደም ተከተል ይንኩ</span></span></button>`;
  }
  const next=KIDS.solved?`<button class="kidsNext" onclick="kidsNext();render()">ቀጣይ ›</button>`:'';
  const msg=KIDS.msg?`<div class="kidsMsg">${KIDS.msg}</div>`:'';
  let body='';
  if(KIDS.game==='letters'){
    const t=KIDS.q.target;
    body=`<div class="kidsQ">ይህ የ<b>${t[1]}</b> ፊደል የትኛው ነው?</div>
      <button class="kidsSpeak" onclick="qaidaSpeak('${t[0]}')">🔊 ያዳምጡ</button>
      <div class="kidsGrid">${KIDS.q.opts.map((o,i)=>`<button class="kidsOpt kidsLetter" onclick="kidsLetterAnswer(${i})">${o[0]}</button>`).join('')}</div>`;
  }
  if(KIDS.game==='words'){
    const t=KIDS.q.target;
    body=`<div class="kidsQ">ይህ ቃል ምን ማለት ነው?</div>
      <button class="kidsWordBig" onclick="qaidaSpeak('${t[0]}')">${t[0]}</button>
      <div class="kidsGrid kidsGridCol">${KIDS.q.opts.map((o,i)=>`<button class="kidsOpt" onclick="kidsWordAnswer(${i})">${o}</button>`).join('')}</div>`;
  }
  if(KIDS.game==='wudu'){
    const left=KIDS.q.order.filter(i=>!KIDS.picked.includes(i));
    const done=KIDS.picked.map(i=>`<div class="kidsDone">${KIDS.picked.indexOf(i)+1}. ${KIDS_WUDU[i]}</div>`).join('');
    body=`<div class="kidsQ">ውዱእ በምን ቅደም ተከተል ነው የሚሰራው? ቅደም ተከተሉን በቁጥር ቅደም ተከተል ይንኩ።</div>
      ${done}
      <div class="kidsGrid kidsGridCol">${left.map(i=>`<button class="kidsOpt" onclick="kidsWuduTap(${i})">${KIDS_WUDU[i]}</button>`).join('')}</div>`;
  }
  return head+msg+body+next+`<button class="kidsBack" onclick="KIDS.game=null;render()">‹ ወደ ጨዋታዎች</button>`;
}

function trackDayKey(d){
  d=d||new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function trackDay(k){ return (DATA.tracker&&DATA.tracker[k])||{}; }
function toggleTrack(item){
  DATA.tracker=DATA.tracker||{};
  const k=trackDayKey();
  const day=DATA.tracker[k]||{};
  day[item]=!day[item];
  DATA.tracker[k]=day;
  const keys=Object.keys(DATA.tracker).sort();
  while(keys.length>60){ delete DATA.tracker[keys.shift()]; }
  saveData(DATA); render();
}
function renderTracker(){
  const today=trackDay(trackDayKey());
  const done=TRACK_ITEMS.filter(i=>today[i.k]).length;
  const pct=Math.round(done/TRACK_ITEMS.length*100);
  let weekDone=0, weekTotal=0;
  for(let i=0;i<7;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    const day=trackDay(trackDayKey(d));
    weekDone+=TRACK_ITEMS.filter(x=>day[x.k]).length;
    weekTotal+=TRACK_ITEMS.length;
  }
  const wpct=Math.round(weekDone/weekTotal*100);
  const rows=TRACK_ITEMS.map(i=>`<button class="trackRow ${today[i.k]?'done':''}" onclick="toggleTrack('${i.k}')">
      <span class="trackBox">${today[i.k]?'✓':''}</span>

      <div class="sectionLabel" style="margin:0">ዛሬ · ${done} / ${TRACK_ITEMS.length}</div>

let _qHandler=null, _qAbs=false;
function stopQibla(){ if(_qHandler){ window.removeEventListener('deviceorientationabsolute',_qHandler,true); window.removeEventListener('deviceorientation',_qHandler,true); _qHandler=null; } }
function qiblaFinder(){
  if(!navigator.geolocation){ toast(t('noGeo')); return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    const b=qiblaBearing(pos.coords.latitude,pos.coords.longitude);
    openModal(`<button class="closeX" onclick="stopQibla();closeModal()">✕</button><h3>${t('qiblaFinder')}</h3>
      <div style="text-align:center;padding:14px 0;color:var(--text)">
        <div class="compassWrap">

            <text x="50" y="95" text-anchor="middle" font-size="8" fill="currentColor" opacity=".5">S</text>
            <text x="94" y="53" text-anchor="middle" font-size="8" fill="currentColor" opacity=".5">E</text>
            <text x="6" y="53" text-anchor="middle" font-size="8" fill="currentColor" opacity=".5">W</text></svg>
          <svg class="kaaba" id="qArrow" viewBox="0 0 100 100" style="transform:rotate(${b}deg)"><path d="M50 8 L63 52 L50 44 L37 52 Z" fill="var(--accent)"/><circle cx="50" cy="50" r="4" fill="currentColor"/></svg>
        </div>
        <p style="margin-top:12px;font-size:17px;font-weight:800">${Math.round(b)}° ${t('fromNorth')}</p>
        <p class="compassHint" id="qHint">🧭 ስልክዎን ጠፍጣፋ ያድርጉ — ቀስቱ ወደ ቂብላ ያመለክታል</p>
        <button class="btn ghost" id="qEnable" style="margin-top:8px">🧭 Compass</button></div>`);
    const arrow=()=>document.getElementById('qArrow'), ring=()=>document.getElementById('qRing');
    const onOri=e=>{
      let h=null;
      if(typeof e.webkitCompassHeading==='number') h=e.webkitCompassHeading;
      else if(e.absolute===true || e.type==='deviceorientationabsolute'){ if(e.alpha!=null) h=360-e.alpha; }
      if(h==null) return;
      const a=arrow(), r=ring(); if(!a){ stopQibla(); return; }
      a.style.transform=`rotate(${b-h}deg)`; r.style.transform=`rotate(${-h}deg)`;
      const hint=document.getElementById('qHint'); if(hint) hint.textContent=Math.abs(((b-h+540)%360)-180)<5?'✅ ወደ ቂብላ ትክክል ነዎት':'🧭 ስልክዎን ያዙሩ';
    };
    const start=async()=>{
      try{
        if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
          const r=await DeviceOrientationEvent.requestPermission(); if(r!=='granted') return;
        }
      }catch(e){ return; }
      stopQibla(); _qHandler=onOri;
      window.addEventListener('deviceorientationabsolute',onOri,true);
      window.addEventListener('deviceorientation',onOri,true);
      const bt=document.getElementById('qEnable'); if(bt) bt.style.display='none';
    };
    const bt=document.getElementById('qEnable'); if(bt) bt.onclick=start;
    if(typeof DeviceOrientationEvent==='undefined'){ if(bt) bt.style.display='none'; }
    else if(typeof DeviceOrientationEvent.requestPermission!=='function'){ start(); }
  },()=>toast(t('noGeo')),{enableHighAccuracy:false,timeout:15000,maximumAge:600000});
}

    <p style="text-align:center;font-size:20px;font-weight:800;margin-top:10px;color:var(--accent)">${h.day} ${hijriName(h.month)} ${h.year}</p>
    <p style="text-align:center;color:var(--muted);font-size:13px">${g.toLocaleDateString()}</p>`);
}

/* ================== AZAN + PRAYER ALERTS ================== */
function openAzanPicker(){
  openModal(`<button class="closeX" onclick="closeModal()">✕</button><h3>${t('azanSound')}</h3>
    <p class="hint">${t('azanHint')}</p>
    <div class="field"><input type="file" id="azan_file" accept="audio/*"></div>
    <div class="btnRow"><button class="btn ghost" onclick="playAzan()">▶</button><button class="btn ghost" onclick="closeModal()">${t('cancel')}</button>
    <button class="btn primary" onclick="saveAzan()">${t('save')}</button></div>`);
}
async function saveAzan(){
  const f=document.getElementById('azan_file').files[0]; if(!f){ closeModal(); return; }
  try{ const old=DATA.azanId; DATA.azanId=await mediaPut(f); if(old) mediaDel(old); saveData(DATA); closeModal(); render(); toast('✅ '+t('saved')); }
  catch(e){ toast('⚠ '+e.message); }
}
async function playAzan(){
  if(!DATA.azanId) return; const u=await mediaURL(DATA.azanId);
  if(u){ try{ new Audio(u).play().catch(()=>{}); }catch(e){} }
}
let lastFired=null;
function checkPrayer(){
  const n=new Date(); const cur=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  const name=Object.keys(DATA.prayerTimes).find(k=>DATA.prayerTimes[k]===cur);
  if(name&&lastFired!==cur){
    lastFired=cur;
    if(DATA.notif) notify(t('prayerNow').replace('{p}',t(name)),formatTime12(cur));
    playAzan();
  }
}

/* ================== SETTINGS ================== */
function srow(icon,t1,t2,fn,cls){
  return `<div class="settingsRow ${cls||''}" onclick="${fn}"><div class="sic">${icon}</div><div class="stext"><div class="st1">${t1}</div>${t2?`<div class="st2">${t2}</div>`:''}</div>${cls==='danger'?'':'<div class="chev">›</div>'}</div>`;
}
function themeName(th){ return th.n[DATA.lang]||th.n.en; }
function renderSettings(){
  const lang=LANGS.find(x=>x.k===DATA.lang); const th=THEMES.find(x=>x.k===DATA.theme)||THEMES[0];
  return `
    <div class="settingsGroupTitle">${t('preferences')}</div>
    ${srow('🌐',t('language'),lang.n,'openLangPicker()')}
    ${srow('🎨',t('theme'),themeName(th),'openThemePicker()')}
    ${srow('🔔',t('notifications'),DATA.notif?t('notifOn'):t('notifOff'),'toggleNotif()')}
    <div class="settingsGroupTitle">${t('support')}</div>
    ${srow('🎧','Support Center',t('getHelpTelegram'),'openSupportLink()')}
    <div class="settingsGroupTitle">${t('adminMode')}</div>
    ${DATA.admin?
      srow('🔑',t('pinLabel'),t('adminOn'),'openPinChanger()')+
      srow('🔊',t('azanSound'),DATA.azanId?t('azanSet'):t('azanNotSet'),'openAzanPicker()')+
      srow('↩',t('logout'),'','logoutAdmin()','danger')
      : srow('🔑',t('adminMode'),'','loginAdmin()')}
    <div class="settingsGroupTitle">${t('about')}</div>
    ${srow('❓',t('about'),t('version')+' 2.0.0',"toast('"+t('appName').replace(/'/g,'’')+" v2.0.0')")}`;
}
function openLangPicker(){
  openModal(`<button class="closeX" onclick="closeModal()">✕</button><h3>${t('language')}</h3>
    ${LANGS.map(l=>`<div class="langRow ${DATA.lang===l.k?'active':''}" onclick="setLang('${l.k}')"><span>${l.n}</span><span>${DATA.lang===l.k?'✓':''}</span></div>`).join('')}`);
}
function openThemePicker(){
  openModal(`<button class="closeX" onclick="closeModal()">✕</button><h3>${t('theme')}</h3>
    <div class="themeGrid">${THEMES.map(th=>`<div class="themeItem ${DATA.theme===th.k?'active':''}" onclick="setTheme('${th.k}')"><div class="dot" style="background:${th.c}"></div>${themeName(th)}</div>`).join('')}</div>`);
}
function setLang(l){ DATA.lang=l; saveData(DATA); closeModal(); render(); }
function setTheme(k){ DATA.theme=k; saveData(DATA); closeModal(); render(); }
function openSupportLink(){ openExternal(DATA.supportLink||SOCIAL_LINKS[0].url); }
function loginAdmin(){
  openModal(`<button class="closeX" onclick="closeModal()">✕</button><h3>${t('adminMode')}</h3>
    <div class="field"><label>Email</label><input type="email" id="aEmail" autocomplete="username"></div><div class="field"><label>Password</label><input type="password" id="aPass" autocomplete="current-password"></div>
    <div class="btnRow"><button class="btn ghost" onclick="closeModal()">${t('cancel')}</button><button class="btn primary" onclick="checkPin()">${t('enter')}</button></div>`);
}
async function checkPin(){
  const em=document.getElementById('aEmail').value.trim(), pw=document.getElementById('aPass').value;
  try{ await awLogin(em,pw); DATA.admin=true; saveData(DATA); closeModal(); render(); }
  catch(e){ toast('⚠ '+e.message); }
}
async function logoutAdmin(){ await awLogout(); DATA.admin=false; saveData(DATA); render(); }
function openPinChanger(){
  openModal(`<button class="closeX" onclick="closeModal()">✕</button><h3>${t('pinLabel')}</h3>
    <div class="field"><label>${t('newPin')}</label><input type="text" id="newPinInput"></div>
    <div class="btnRow"><button class="btn ghost" onclick="closeModal()">${t('cancel')}</button><button class="btn primary" onclick="changePin()">${t('save')}</button></div>`);
}
function changePin(){ const v=document.getElementById('newPinInput').value.trim(); if(!v) return; DATA.adminPin=v; saveData(DATA); closeModal(); toast('✅ '+t('saved')); }

/* ================== MODAL ================== */
function openModal(html){
  closeModal();
  const ov=document.createElement('div'); ov.className='overlay'; ov.id='modalOverlay';
  ov.innerHTML=`<div class="sheet" style="position:relative">${html}</div>`;
  ov.addEventListener('click',e=>{ if(e.target===ov) closeModal(); });
  document.body.appendChild(ov);
}
function closeModal(){ try{stopQibla();}catch(e){} const o=document.getElementById('modalOverlay'); if(o) o.remove(); }

/* ================== START ================== */
render();
(function(){
  const s=document.getElementById('splash'); if(!s) return;
  s.querySelector('img').src=LOGO_URI; s.querySelector('h1').textContent=t('appName'); s.querySelector('p').textContent=t('greet');
  setTimeout(()=>{ s.classList.add('hide'); setTimeout(()=>s.remove(),700); },1900);
})();
setInterval(checkPrayer,15000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkPrayer(); });
/* browsers block audio until the first tap — unlock it silently */
(function(){ const un=()=>{ try{ const a=new Audio(); a.muted=true; a.play&&a.play().catch(()=>{}); }catch(e){} document.removeEventListener('pointerdown',un); }; document.addEventListener('pointerdown',un,{once:true}); })();
/* ===== Ask visitors to install / download the app ===== */
(function(){
  const ua=navigator.userAgent||'';
  const isStandalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  const inAppWebView=/; wv\)/.test(ua)||!location.protocol.startsWith('http');
  const isAndroid=/Android/i.test(ua), isIOS=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  return; // automatic 'download the app' banner is disabled (the old APK is outdated)
  if(isStandalone||inAppWebView||!(isAndroid||isIOS)) return;
  const KEY='risala_install_dismissed';
  try{ const d=+localStorage.getItem(KEY)||0; if(Date.now()-d<3*24*3600*1000) return; }catch(e){}
  let deferred=null;
  window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferred=e; const b=document.getElementById('instPwa'); if(b) b.style.display=''; });
  window.addEventListener('appinstalled',()=>hide(true));
  function hide(save){ const el=document.getElementById('installBar'); if(el) el.remove(); if(save){ try{localStorage.setItem(KEY,String(Date.now()));}catch(e){} } }
  function show(){
    if(document.getElementById('installBar')) return;
    const bar=document.createElement('div'); bar.id='installBar';
    const am=DATA.lang==='am';
    const title=am?'የሪሳላ አፑን ያውርዱ':'Get the Risala app';
    const sub=isIOS?(am?'በSafari ወደ መነሻ ገጽ ያክሉት':'Add it to your Home Screen'):(am?'ፈጣን፣ ያለ ኢንተርኔትም ይሰራል':'Faster, works offline');
    bar.innerHTML=`<img src="${LOGO_URI}" alt=""><div class="it"><b>${title}</b><span>${sub}</span></div>
      <div class="ib">${isAndroid?`<a class="go" href="risala.apk" download="Risala.apk" id="instApk">⬇ ${am?'አውርድ':'Download'}</a>`:`<button class="go" id="instIos">${am?'እንዴት?':'How?'}</button>`}
      ${isAndroid?`<button class="go" id="instPwa" style="display:none;background:var(--brand)">${am?'ጫን':'Install'}</button>`:''}
      <button class="no" id="instNo">${am?'ዝጋ':'Not now'}</button></div>`;
    document.body.appendChild(bar);
    document.getElementById('instNo').onclick=()=>hide(true);
    const apk=document.getElementById('instApk'); if(apk) apk.addEventListener('click',()=>{ toast(am?'ማውረድ ተጀምሯል። ከጨረሰ በኋላ ፋይሉን ከፍተው ይጫኑ።':'Download started. Open the file to install.'); setTimeout(()=>hide(true),1500); });
    const pwa=document.getElementById('instPwa'); if(pwa){ if(deferred) pwa.style.display=''; pwa.onclick=async()=>{ if(!deferred) return; deferred.prompt(); try{ await deferred.userChoice; }catch(e){} deferred=null; hide(true); }; }
    const ios=document.getElementById('instIos'); if(ios) ios.onclick=()=>openModal(`<button class="closeX" onclick="closeModal()">✕</button><h3>${am?'አፑን በiPhone ላይ ለመጫን':'Install on iPhone'}</h3>
      <p style="line-height:1.9">${am?'1. Safari ውስጥ የ <b>Share</b> (⬆︎) ምልክቱን ይጫኑ<br>2. <b>"Add to Home Screen"</b> ይምረጡ<br>3. <b>Add</b> ይጫኑ':'1. Tap the <b>Share</b> (⬆︎) button in Safari<br>2. Choose <b>"Add to Home Screen"</b><br>3. Tap <b>Add</b>'}</p>`);
  }
  setTimeout(show,3200);
})();
/* PWA: offline support */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
setInterval(()=>{ const e=document.getElementById('nextPrayer'); if(e) e.textContent=nextPrayerText(); },30000);

(function(){
  const __render=render; render=function(){ __render.apply(this,arguments); modernIcons(appEl); };
  const __open=openModal; openModal=function(){ __open.apply(this,arguments); modernIcons(document.getElementById('modalOverlay')); };
  modernIcons(appEl);
})();

awInit();
